# Conscrypt desligado de propósito.
#
# Por padrão o Robolectric instala o Conscrypt como security provider
# (AndroidTestEnvironment.setUpApplicationState). O Conscrypt não publica binário nativo
# para windows-aarch_64, então em Windows ARM64 todo teste Robolectric morre com
# UnsatisfiedLinkError antes de executar uma linha do teste.
#
# Desligar é seguro aqui: o app não faz rede (sem permissão INTERNET no manifest), logo
# nenhum caminho de código exercitado por teste depende de TLS.
conscryptMode=OFF
